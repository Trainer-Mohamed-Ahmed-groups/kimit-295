<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
    <style>
        body {
            height: 8000px;
        }

        * {
            box-sizing: border-box;
        }

        .linear_explain {
            height: 400px;
            width: 400px;
            /* background-image: linear-gradient(red 50%, green 70%, blue); */
            /* background-image: linear-gradient(red, green, blue, red, green, blue); */
            /* background-image: radial-gradient(red, green); */
            /* background-image: repeating-linear-gradient(blue, red 200px); */
            /* background-image: repeating-radial-gradient(blue, red 50%); */
            /* background-image: conic-gradient(blue, red 50%); */
            background: url(./images/tiger.jpg) no-repeat fixed center center/ cover;
        }

        .border_explain {
            height: 150px;
            width: 150px;
            border-top: 20px red solid;
            border-right: 5px blue dotted;
            border-bottom: 10px blue dashed;
            border-left: 15px blue groove;
        }

        .radius_explain {
            height: 200px;
            width: 200px;
            background-color: #888;
            /* border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
            border-bottom-left-radius: 30px; */
            /* border-radius: 30px; */
            border-start-end-radius: 50px;
        }

        .spacing_explain {
            height: 300px;
            width: 300px;
            background-color: #888;
            /* margin-left: 128px; */
            /* margin-top: 47px; */
            /* margin: 50px 100px 20px;*/
            /* margin-inline-start: 150px; */
            padding: 50px;
            border: 10px solid;
        }

        section>div {
            font-weight: bold;
            color: red;
            font-size: 2rem;
        }

        /* section nav .custom+div { */
        section nav .custom~div {
            background-color: green;
        }
    </style>
</head>

<body>

    <div class="linear_explain"></div>
    <div class="border_explain">This is for border</div>
    <hr>

    <div class="radius_explain"></div>


    <p class="spacing_explain">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Voluptates, nulla debitis
        accusantium odio recusandae consectetur aperiam amet, veniam suscipit sit eveniet laudantium commodi, dolorum
        corrupti nihil ab culpa porro aspernatur?</p>

    <section>
        <nav>
            <div>1</div>
            <div class="custom">2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </nav>
        <footer>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
        </footer>
        <div>13</div>
    </section>
</body>

</html>
